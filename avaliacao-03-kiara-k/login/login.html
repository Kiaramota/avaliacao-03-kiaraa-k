<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - kmr</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Cabeçalho Superior -->
    <header class="site-header">
        <a href="index.html" class="brand-logo">kmr<span>.art</span></a>

        <nav class="main-nav" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produto.html">Ofertas</a></li>
                <li><a href="new.html">Cadastro</a></li>
                <li><a href="login.html" class="active">Contato</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="login.html" class="btn-header-login">Login</a>
        </div>
    </header>

    <!-- Área Principal de Login -->
    <main class="auth-page">
        <section class="login-container" aria-label="Formulário de login">
            <h1>Login</h1>

            <form class="login-form" action="index.html" method="get">
                <div class="input-group">
                    <input type="email" placeholder="Informe o seu e-mail" aria-label="E-mail" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Informe a sua senha" aria-label="Senha" required>
                </div>

                <button type="submit" class="btn-submit">
                    <span>➜]</span> Entrar
                </button>

                <a href="new.html" class="btn-register">
                    <span>👤+</span> Criar conta
                </a>
            </form>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="site-footer">
        <div class="footer-logo">kmr</div>
        <p>A kmr é um ateliê autoral que oferece os melhores desenhos e artes exclusivas para você.</p>
        <small>© 2026 kmr. Todos os direitos reservados.</small>
    </footer>

</body>
</html>
