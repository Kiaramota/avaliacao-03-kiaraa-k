<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Usuário - kmr</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Cabeçalho (Base do teu exercício) -->
    <header>
        <h2>kmr<span>.art</span></h2>

        <nav>
            <ul>
                <li><a href="index.html">home</a></li>
                <li><a href="#">ofertas</a></li>
                <li><a href="#">contato</a></li>
            </ul>
        </nav>

        <section>
            <a href="login.html" class="btn-login">login</a>
        </section>
    </header>

    <!-- Área Principal de Cadastro -->
    <main class="register-container">
        <h2>👤+ Novo Usuário</h2>

        <form class="register-form">
            <!-- Campos de Texto -->
            <div class="input-group">
                <input type="email" placeholder="Informe o seu e-mail" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Informe o seu password" required>
            </div>

            <div class="input-group">
                <input type="text" placeholder="Informe o seu nome" required>
            </div>

            <!-- Select / Menu Suspenso -->
            <div class="input-group">
                <select name="perfil" id="perfil">
                    <option value="visitante">Visitante</option>
                    <option value="cliente">Cliente</option>
                    <option value="artista">Artista / Desenhista</option>
                </select>
            </div>

            <!-- Radio Buttons (Interesses/Preferências) -->
            <div class="radio-group">
                <label>
                    <input type="radio" name="categoria" value="geometrico" checked>
                    Geométrico & Mandalas
                </label>
                <label>
                    <input type="radio" name="categoria" value="fineline">
                    Giz oleoso & Divertido
                </label>
                <label>
                    <input type="radio" name="categoria" value="todos">
                    Todos os estilos
                </label>
            </div>

            <!-- Upload da Foto de Perfil -->
            <div class="profile-upload-section">
                <div class="avatar-placeholder">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="avatar" name="avatar" accept="image/*">
                </div>
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn-submit">
                <span>👤+</span> Criar conta
            </button>
        </form>
    </main>

    <!-- Rodapé -->
    <footer class="site-footer">
        <div class="footer-logo">kmr</div>
        <p>A kmr é um ateliê autoral que oferece os melhores desenhos e artes exclusivas para você.</p>
        <small>© 2026 kmr. Todos os direitos reservados.</small>
    </footer>

</body>
</html>
